name: Build Frontend and Create Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for commit hash
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
    
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
    
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
    
      - name: Get commit information
        id: commit-info
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --format=%cd --date=short HEAD)
          BRANCH=${GITHUB_REF#refs/heads/}
          
          if [ "$BRANCH" = "main" ]; then
            TAG="stable-${DATE}-${SHORT_HASH}"
            RELEASE_TYPE="stable"
          elif [ "$BRANCH" = "develop" ]; then
            TAG="nightly-${DATE}-${SHORT_HASH}"
            RELEASE_TYPE="nightly"
          else
            echo "Unknown branch: $BRANCH"
            exit 1
          fi
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "release_type=${RELEASE_TYPE}" >> $GITHUB_OUTPUT
          echo "short_hash=${SHORT_HASH}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
    
      - name: Package frontend dist
        run: |
          cd frontend
          tar -czf ../frontend-dist-${{ steps.commit-info.outputs.tag }}.tar.gz dist/
    
      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.commit-info.outputs.tag }}
          name: ${{ steps.commit-info.outputs.release_type }} Release ${{ steps.commit-info.outputs.date }} (${{ steps.commit-info.outputs.short_hash }})
          body: |
            Automated ${{ steps.commit-info.outputs.release_type }} release
            
            - Date: ${{ steps.commit-info.outputs.date }}
            - Commit: ${{ steps.commit-info.outputs.short_hash }}
            - Branch: ${{ github.ref_name }}
            
            This release contains pre-built frontend assets for deployment.
          files: frontend-dist-${{ steps.commit-info.outputs.tag }}.tar.gz
          draft: false
          prerelease: ${{ steps.commit-info.outputs.release_type == 'nightly' }}
          fail_on_unmatched_files: false
