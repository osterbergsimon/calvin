name: Accessibility E2E

# CLV-65: an accessibility baseline contributors cannot regress. Every PR that
# touches the frontend runs axe against the dashboard, every Settings category,
# the pages editor and the lock screen — phone and kiosk, light and dark.
# GitHub-hosted minutes are free for this repository.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/e2e-a11y.yml"

concurrency:
  group: a11y-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y-e2e:
    name: Accessibility (axe) E2E
    # Pin the runner: Playwright 1.57 has no support for ubuntu-26.04 yet
    # ("Playwright does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      # Serious and critical axe violations fail the build. Moderate findings
      # are attached to the Playwright report instead of failing; record them
      # in the PR body. Colour contrast is covered by the theme contrast tests.
      # The backend is mocked with route interception; nothing reaches a real
      # Calvin and host-acting routes are always intercepted.
      - name: Run accessibility E2E
        working-directory: ./frontend
        run: npx playwright test --project=a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
