name: Phone E2E

# CLV-66: the phone is the setup device, so a PR that touches the frontend must
# keep every settings flow usable at 390x844 (and on an 800x480 kiosk).
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/e2e-phone.yml"

concurrency:
  group: phone-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-e2e:
    name: Phone & kiosk settings E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      # The suite mocks the backend with route interception; no backend is
      # started. Host-acting routes (restart, update, display) are always
      # intercepted by tests/e2e/phone/fixtures/api-mock.js.
      - name: Run phone and kiosk E2E
        working-directory: ./frontend
        run: npx playwright test --project=phone

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-phone-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
