name: Secret Scan

# gitleaks on every PR to main/develop. The action scans the commits the PR
# adds (not all of history), so the pre-publication history — and the fixtures
# allowlisted in .gitleaks.toml — cannot fail an unrelated PR.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # Pin the scanner so config behaviour does not change under us.
          GITLEAKS_VERSION: "8.30.1"
