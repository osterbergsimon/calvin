name: Setup Validation Prod

on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/setup.sh'
      - 'scripts/setup-dev.sh'
      - 'scripts/setup-common.sh'
      - 'scripts/update-calvin.sh'
      - 'scripts/restart-calvin-services.sh'
      - 'deploy/systemd/**'
      - 'docker/docker-compose.yml'
      - 'deploy/calvin.env.example'
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/setup.sh'
      - 'scripts/setup-dev.sh'
      - 'scripts/setup-common.sh'
      - 'scripts/update-calvin.sh'
      - 'scripts/restart-calvin-services.sh'
      - 'deploy/systemd/**'
      - 'docker/docker-compose.yml'
      - 'deploy/calvin.env.example'
  workflow_dispatch:

jobs:
  validate-scripts:
    name: Validate Setup Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/setup-dev.sh
          bash -n scripts/setup-common.sh
          bash -n scripts/update-calvin.sh
          bash -n scripts/restart-calvin-services.sh

      - name: Check systemd unit syntax
        run: |
          sudo install -m 0755 scripts/update-calvin.sh /usr/local/bin/update-calvin.sh
          systemd-analyze verify deploy/systemd/calvin-app.service
          systemd-analyze verify deploy/systemd/calvin-kiosk.service
          systemd-analyze verify deploy/systemd/calvin-x.service

      - name: Check compose YAML is parseable
        run: |
          # `docker compose config` does full validation incl. var
          # substitution. Cheaper alternative: just yaml-load.
          python3 -c "import yaml; yaml.safe_load(open('docker/docker-compose.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('docker/docker-compose.dev.yml'))"

      - name: Confirm dev wrapper still execs setup.sh --mode dev
        run: |
          # Catches regressions where setup-dev.sh diverges from the
          # canonical setup.sh while the docker-in-docker e2e job
          # below only exercises --mode prod.
          grep -q "exec bash.*setup.sh.*--mode dev" scripts/setup-dev.sh

  test-production-setup:
    name: Test setup.sh --mode prod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run setup in Docker and assert health
        run: |
          cat > /tmp/ci-test-setup-prod.sh <<'TEST_EOF'
          #!/bin/bash
          set -euo pipefail

          cp -r /calvin /tmp/calvin-test
          cd /tmp/calvin-test
          chmod +x scripts/*.sh

          export CALVIN_DIR="/home/calvin/calvin"
          export CALVIN_USER="calvin"
          export CALVIN_DATA_DIR="/var/lib/calvin"
          export CALVIN_SKIP_GIT_UPDATE="1"
          export LOG_FILE="/tmp/calvin-setup.log"
          export GIT_REPO="https://github.com/osterbergsimon/calvin.git"
          export GIT_BRANCH="${GITHUB_HEAD_REF:-develop}"

          if ! id calvin >/dev/null 2>&1; then
            useradd -m -s /bin/bash calvin
          fi

          mkdir -p /home/calvin
          cp -r /tmp/calvin-test /home/calvin/calvin
          chown -R calvin:calvin /home/calvin/calvin

          mkdir -p /tmp/calvin-ci-image
          cat > /tmp/calvin-ci-image/server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/api/health":
                      body = b'{"status":"healthy"}'
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  else:
                      self.send_response(404)
                      self.end_headers()


          HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
          PY
          cat > /tmp/calvin-ci-image/Dockerfile <<'DOCKERFILE'
          FROM debian:sid-slim
          RUN apt-get update -qq && apt-get install -y -qq python3 curl ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY server.py /server.py
          EXPOSE 8000
          CMD ["python3", "/server.py"]
          DOCKERFILE
          docker build -q -t ghcr.io/osterbergsimon/calvin:latest /tmp/calvin-ci-image

          bash scripts/setup.sh --mode prod

          test -f /etc/calvin/docker-compose.yml
          test -f /etc/calvin/.env
          test -d /var/lib/calvin/db
          test -d /var/lib/calvin/images
          test -d /var/lib/calvin/plugins
          test -d /var/lib/calvin/logs
          test -f /etc/systemd/system/calvin-app.service
          test -f /etc/systemd/system/calvin-kiosk.service
          test ! -f /etc/systemd/system/calvin-backend.service
          test ! -f /etc/systemd/system/calvin-frontend.service

          timeout 180 bash -c 'until curl -fsS http://localhost:8000/api/health; do sleep 3; done'
          TEST_EOF

          chmod +x /tmp/ci-test-setup-prod.sh

          docker run --rm --privileged \
            --network host \
            --tmpfs /tmp --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/calvin:ro" \
            -v "/tmp/ci-test-setup-prod.sh:/tmp/ci-test-setup-prod.sh:ro" \
            debian:sid-slim \
            bash -c "
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq curl git sudo bash python3 ca-certificates sed systemd systemd-sysv dbus docker.io
              docker compose version >/dev/null 2>&1 || apt-get install -y -qq docker-compose-plugin || true
              docker compose version >/dev/null 2>&1 || apt-get install -y -qq docker-compose-v2 || true
              docker compose version >/dev/null 2>&1 || command -v docker-compose >/dev/null 2>&1 || apt-get install -y -qq docker-compose
              bash /tmp/ci-test-setup-prod.sh
            "
