name: TMP baselines

# Temporary (calvin-ip3l): regenerate the ui-gallery visual baselines on the
# same runner image CI compares against, then push them to a scratch branch.
on:
  push:
    branches: [calvin-ip3l]

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: calvin-ip3l

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Regenerate gallery baselines
        working-directory: ./frontend
        run: npx playwright test tests/e2e/ui-gallery.spec.js --project=chromium --update-snapshots

      - name: Push baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B tmp-gallery-baselines
          git add frontend/tests/e2e/ui-gallery.spec.js-snapshots
          git commit -m "chore: CI gallery baselines (temporary)" || echo "no changes"
          git push --force origin tmp-gallery-baselines
