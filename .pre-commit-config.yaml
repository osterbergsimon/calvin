repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      # Run the formatter first (Black-compatible)
      - id: ruff-format
        files: ^backend/.*\.py$
      # Then run the linter (will auto-fix what it can)
      - id: ruff
        files: ^backend/.*\.py$
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.15.0
    hooks:
      - id: eslint
        files: ^frontend/.*\.(js|vue)$
        additional_dependencies:
          - eslint@9.15.0
          - '@eslint/js@9.15.0'
          - 'eslint-plugin-vue@9.32.0'
        args: [--fix, --config, frontend/eslint.config.js]
        types_or: [file]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/.*\.(js|jsx|vue|json|css)$
        # Exclude workflow files - they should not be autoformatted
        exclude: ^\.github/workflows/.*\.yml$

