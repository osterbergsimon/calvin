repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      # Run the formatter first (Black-compatible)
      - id: ruff-format
        files: ^backend/.*\.py$
      # Then run the linter (will auto-fix what it can)
      - id: ruff
        files: ^backend/.*\.py$
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'cd frontend && npx --no-install eslint --fix --config eslint.config.js "$@"' --
        files: ^frontend/.*\.(js|vue)$
        types_or: [file]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/.*\.(js|jsx|vue|json|css)$
        # Exclude workflow files - they should not be autoformatted
        exclude: ^\.github/workflows/.*\.yml$
        additional_dependencies:
          - prettier@3.6.2

