[project]
name = "calvin-backend"
version = "0.1.0"
description = "Calvin Dashboard Backend"
license = {text = "GPL-3.0"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
    "APScheduler>=3.10.4",
    "Pillow>=10.1.0",
    "aiofiles>=23.2.1",
    "sqlalchemy>=2.0.23",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
    # Note: websockets 15.0.1 is fine - it's a Python package, not npm
    "icalendar>=5.0.0", # For parsing iCal/ICS files (Google Calendar share links)
    "httpx>=0.25.0",
    "python-multipart>=0.0.6", # Required for FastAPI file uploads (UploadFile)
    "pytz>=2023.3", # For timezone support in display schedule
    "pluggy>=1.3.0", # For dynamic plugin loading
    "alembic>=1.13.0", # For database migrations
    "loguru>=0.7.0", # For better logging (simpler and more reliable than standard logging)
    "pre-commit>=4.3.0",
]

# Platform-specific dependencies
# evdev is Linux-only, so we make it optional
[project.optional-dependencies]
linux = [
    "evdev>=1.6.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
    "faker>=20.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "bandit>=1.7.5",
    "pre-commit>=3.5.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-awesome-pages-plugin>=2.9.0",
    "pymdown-extensions>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N815",  # Allow mixedCase for Pydantic model fields
    # Formatting-related rules that conflict with ruff format
    "E501",  # line-too-long (handled by formatter)
    "W191",  # tab-indentation (handled by formatter)
    "E111",  # indentation-with-invalid-multiple (handled by formatter)
    "E114",  # indentation-with-invalid-multiple-comment (handled by formatter)
    "E117",  # over-indented (handled by formatter)
    "Q000",  # bad-quotes-inline-string (handled by formatter)
    "Q001",  # bad-quotes-multiline-string (handled by formatter)
    "Q002",  # bad-quotes-docstring (handled by formatter)
    "Q003",  # avoidable-escaped-quote (handled by formatter)
    "COM812",  # missing-trailing-comma (handled by formatter)
    "COM819",  # prohibited-trailing-comma (handled by formatter)
]
# Auto-fix issues when possible
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings (Black-compatible)
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Respect magic trailing comma
skip-magic-trailing-comma = false
# Line ending style
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore:datetime.datetime.utcnow.*:DeprecationWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

