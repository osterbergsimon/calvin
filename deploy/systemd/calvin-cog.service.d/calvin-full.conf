# All-in-one install only (scripts/setup.sh): the Calvin backend runs on this Pi
# in calvin-app.service, so cog waits for it before opening the dashboard (the
# FULL Chromium unit, calvin-kiosk.service, does the same). A remote kiosk does
# not get this drop-in; its calvin-cog.service is the kiosk bundle's, unchanged.
[Unit]
After=calvin-app.service
Wants=calvin-app.service

[Service]
# The wait below can outlast systemd's default 90 s start timeout on a first
# boot that still pulls the runtime image.
TimeoutStartSec=300
# CALVIN_BACKEND_URL (http://localhost:<port>) comes from /etc/default/calvin-kiosk.
# Shell-side expansions are written $${...} (and % as %%) so systemd leaves them.
ExecStartPre=/bin/bash -c 'timeout=240; elapsed=0; until curl -sf "$${CALVIN_BACKEND_URL%%/}/api/health" > /dev/null 2>&1; do if [ $elapsed -ge $timeout ]; then echo "Calvin app not ready after $timeout seconds"; exit 1; fi; sleep 1; elapsed=$((elapsed+1)); done'
