version: '3.8'

# Backend-only compose file for distributed deployment
# Run this on the machine hosting the backend (e.g., home server)

services:
  calvin-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend-prod
    image: calvin-backend:latest
    container_name: calvin-backend
    ports:
      - "8000:8000"
    volumes:
      - calvin-data:/app/data
      - calvin-logs:/app/logs
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///app/data/db/calvin.db
      - IMAGE_DIR=/app/data/images
      # CORS configuration - MUST include the frontend URL(s)
      # Example: CORS_ORIGINS=http://192.168.1.50:80,http://rpi.local:80
      - CORS_ORIGINS=${CORS_ORIGINS}
      - CORS_ALLOW_ALL=${CORS_ALLOW_ALL:-false}
    networks:
      - calvin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  calvin-data:
  calvin-logs:

networks:
  calvin-network:
    driver: bridge
