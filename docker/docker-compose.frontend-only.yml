version: '3.8'

# Frontend-only compose file for distributed deployment
# Run this on the machine hosting the frontend (e.g., Raspberry Pi)
# Set BACKEND_URL environment variable to point to your backend server

services:
  calvin-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend-prod
      args:
        # Backend API URL - MUST be set to the backend server URL
        # Example: http://192.168.1.100:8000/api or http://server.local:8000/api
        - VITE_API_URL=${BACKEND_URL:-http://localhost:8000/api}
    image: calvin-frontend:latest
    container_name: calvin-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
