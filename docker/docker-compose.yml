# Calvin production compose — single canonical service.
#
# Pulls the runtime image CI publishes to GHCR. Frontend dist is baked
# into the image; FastAPI serves it on the same port as the API. No
# separate frontend container, no nginx, no rebuild-on-install.
#
# Configuration comes from a `.env` file *next to this compose file*.
# Compose auto-loads it for both YAML substitution and as the
# container's environment. In production, copy this file plus your
# edited .env to /etc/calvin/ and run:
#
#   docker compose -f /etc/calvin/docker-compose.yml up -d
#
# Locally during development you can run from the repo:
#
#   cp deploy/calvin.env.example docker/.env
#   docker compose -f docker/docker-compose.yml up -d

services:
  calvin:
    image: ghcr.io/osterbergsimon/calvin:${CALVIN_IMAGE_TAG:-latest}
    container_name: calvin
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/lib/calvin/db/calvin.db}
      IMAGE_DIR: ${IMAGE_DIR:-/var/lib/calvin/images}
      PLUGIN_DIR: ${PLUGIN_DIR:-/var/lib/calvin/plugins}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "${CALVIN_PORT:-8000}:8000"
    volumes:
      # Persistent state — DB, images, installed plugins. The runtime
      # image already declares CALVIN_DATA_DIR=/var/lib/calvin.
      - "${CALVIN_DATA_DIR:-/var/lib/calvin}:/var/lib/calvin"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
