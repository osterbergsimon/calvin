<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chips and tags</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root { --bg-0:#eef1f4; --bg-1:#fff; --bg-2:#fff; --line:#dde3e8; --line-soft:#e8edf1; --ink:#1b242b; --ink-2:#5d6b75; --ink-3:#93a0a9; --focus:#e08a1e; --ok:#2f8a57; --warn:#b7791f; --err:#c4452b; --radius-sm:6px;
  --font-ui:"IBM Plex Sans",system-ui,sans-serif; --font-data:"IBM Plex Mono",ui-monospace,monospace; --font-display:"IBM Plex Sans Condensed",system-ui,sans-serif; }
.dark { --bg-0:#0e1316; --bg-1:#151c21; --bg-2:#1d262d; --line:#27313a; --line-soft:#202a31; --ink:#eaf0f3; --ink-2:#9aa7b0; --ink-3:#62707a; --focus:#f3b052; --ok:#4fbf80; --warn:#e2a64a; --err:#ec6f55; }
* { box-sizing:border-box; } body { margin:0; background:#d9dee3; font-family:var(--font-ui); color:var(--ink); }
.board { padding:32px 16px; max-width:1360px; margin:0 auto; } h1 { font-family:var(--font-display); margin:0 0 20px; }
figure { margin:0 0 32px; } figcaption { font-size:.85rem; color:#5d6b75; margin-top:8px; max-width:1280px; }
.frame { width:1280px; background:var(--bg-0); color:var(--ink); border-radius:6px; box-shadow:0 2px 12px rgba(0,0,0,.18); overflow:hidden; }
.label { font-family:var(--font-data); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); padding:14px 20px 0; }
/* before */
.b-strip { display:flex; align-items:center; gap:8px; padding:12px 20px; background:var(--bg-0); border-bottom:1px solid var(--line); }
.b-tab { padding:5px 14px; border-radius:999px; font-size:.85rem; color:var(--ink-2); font-weight:550; line-height:1.15; }
.b-tab small { display:block; font-size:.72rem; color:var(--ink-3); font-weight:400; }
.b-tab.on { background:var(--bg-1); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.15); font-weight:650; }
.b-dot { display:inline-block; width:7px; height:7px; border-radius:2px; background:var(--focus); margin-right:6px; }
.b-add { width:30px; height:30px; border:1px dashed var(--line); border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--ink-3); }
.b-head { padding:14px 20px; font-size:.82rem; color:var(--ink-3); } .b-chip { padding:2px 8px; border-radius:999px; font-weight:700; letter-spacing:.04em; background:color-mix(in srgb,var(--focus) 18%,transparent); color:var(--focus); text-transform:uppercase; font-size:.72rem; }
/* after */
.a-strip { display:flex; align-items:stretch; height:44px; padding:0 12px; background:var(--bg-1); border-bottom:1px solid var(--line); }
.a-tab { position:relative; display:flex; align-items:center; gap:8px; padding:0 12px; font-size:.86rem; color:var(--ink-2); font-weight:500; }
.a-tab small { font-size:.75rem; color:var(--ink-3); font-weight:400; }
.a-tab.on { color:var(--ink); font-weight:600; } .a-tab.on::after { content:""; position:absolute; left:12px; right:12px; bottom:0; height:2px; background:var(--focus); border-radius:2px 2px 0 0; }
.a-tab small.ns { color:color-mix(in srgb,var(--warn) 75%,var(--ink)); }
.a-add { display:flex; align-items:center; gap:6px; padding:0 12px; color:var(--ink-2); font-size:.86rem; font-weight:500; }
.a-head { padding:14px 20px; display:flex; align-items:baseline; gap:6px; } .a-head h3 { margin:0; font-size:1rem; font-weight:600; } .a-head span { font-size:.86rem; color:var(--ink-3); }
.cols { display:grid; grid-template-columns:1fr 1fr; } .cols > div { border-right:1px solid var(--line); } .cols > div:last-child { border-right:0; }
/* tags */
.tag { display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 7px; border-radius:var(--radius-sm); font:500 .75rem/1 var(--font-ui); white-space:nowrap; color:var(--ink-2); border:1px solid var(--line); }
.tag.ok,.tag.warn,.tag.err,.tag.focus { border-width:1px; border-style:solid; }
.tag.ok { color:color-mix(in srgb,var(--ok) 75%,var(--ink)); background:color-mix(in srgb,var(--ok) 10%,transparent); border-color:color-mix(in srgb,var(--ok) 35%,var(--line)); }
.tag.warn { color:color-mix(in srgb,var(--warn) 75%,var(--ink)); background:color-mix(in srgb,var(--warn) 10%,transparent); border-color:color-mix(in srgb,var(--warn) 35%,var(--line)); }
.tag.err { color:color-mix(in srgb,var(--err) 75%,var(--ink)); background:color-mix(in srgb,var(--err) 10%,transparent); border-color:color-mix(in srgb,var(--err) 35%,var(--line)); }
.tag.focus { color:color-mix(in srgb,var(--focus) 75%,var(--ink)); background:color-mix(in srgb,var(--focus) 10%,transparent); border-color:color-mix(in srgb,var(--focus) 35%,var(--line)); }
.tag.count { font-family:var(--font-data); min-width:20px; justify-content:center; padding:0 5px; }
.cat { padding:16px 20px 20px; background:var(--bg-1); display:grid; grid-template-columns:150px 1fr; gap:12px 16px; align-items:center; font-size:.85rem; }
.cat .k { color:var(--ink-3); font-size:.78rem; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.old { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.75rem; }
</style>
</head>
<body>
<main class="board">
  <h1>Chips, tags and page tabs</h1>
  <figure>
    <div class="frame">
      <div class="cols">
        <div>
          <div class="label">Before</div>
          <div class="b-strip">
            <div class="b-tab on"><span class="b-dot"></span>Home<small>All screens</small></div>
            <div class="b-tab"><span class="b-dot"></span>Photos<small>Hallway</small></div>
            <div class="b-tab"><span class="b-dot"></span>Week<small>Kitchen</small></div>
            <div class="b-add">+</div>
          </div>
          <div class="b-head"><span class="b-chip">Region</span> in “Home”</div>
        </div>
        <div>
          <div class="label">After</div>
          <div class="a-strip">
            <div class="a-tab on">Home <small>All screens</small></div>
            <div class="a-tab">Photos <small>Hallway</small></div>
            <div class="a-tab">Week <small class="ns">Not shown</small></div>
            <div class="a-add">+ Page</div>
          </div>
          <div class="a-head"><h3>Region</h3><span>· in Home</span></div>
        </div>
      </div>
    </div>
    <figcaption><b>T1 · Editor page tabs and inspector heading.</b> Before: two-line pills, a meaningless orange square on every tab, a white-on-near-white active state, a dashed-circle +, and an uppercase chip used as a heading. After: one-line underline tabs (name plus where it shows), an orange underline for the active tab, <b>+ Page</b> as text, and a real heading.</figcaption>
  </figure>

  <figure>
    <div class="frame">
      <div class="cols">
        <div>
          <div class="label">One Tag · light</div>
          <div class="cat">
            <span class="k">neutral</span><div class="row"><span class="tag">This screen</span><span class="tag">Photos</span><span class="tag">Portrait · 1080×1920</span><span class="tag">Admin</span></div>
            <span class="k">status</span><div class="row"><span class="tag ok">Installed</span><span class="tag warn">Update</span><span class="tag err">⚠ Host control</span><span class="tag focus">Changed here</span></div>
            <span class="k">count</span><div class="row"><span class="tag count">3</span><span class="tag count focus">12</span><span class="tag count warn">2</span></div>
            <span class="k">old, removed</span><div class="row"><span class="old" style="background:#e3f2fd;color:#1976d2;font-weight:600">calendar</span><span class="old" style="background:#f3e5f5;color:#7b1fa2;font-weight:600">image</span><span class="old" style="background:#e8f5e9;color:#388e3c;font-weight:600">service</span><span class="old" style="border:1px solid #dde3e8;border-radius:4px;color:#5d6b75">image</span></div>
          </div>
        </div>
        <div class="dark">
          <div class="label">One Tag · Backlit</div>
          <div class="cat">
            <span class="k">neutral</span><div class="row"><span class="tag">This screen</span><span class="tag">Photos</span><span class="tag">Portrait · 1080×1920</span><span class="tag">Admin</span></div>
            <span class="k">status</span><div class="row"><span class="tag ok">Installed</span><span class="tag warn">Update</span><span class="tag err">⚠ Host control</span><span class="tag focus">Changed here</span></div>
            <span class="k">count</span><div class="row"><span class="tag count">3</span><span class="tag count focus">12</span><span class="tag count warn">2</span></div>
            <span class="k">old, removed</span><div class="row"><span class="old" style="background:#e3f2fd;color:#1976d2;font-weight:600">calendar</span><span class="old" style="background:#f3e5f5;color:#7b1fa2;font-weight:600">image</span><span class="old" style="background:#e8f5e9;color:#388e3c;font-weight:600">service</span></div>
          </div>
        </div>
      </div>
    </div>
    <figcaption><b>T2 · One Tag component instead of ~20.</b> One height (20px), one radius, one weight, sentence case. Neutral for labels, tinted tones only for real status, mono for counts. The hard-coded plugin-type colours (bottom row) go: they ignore the theme and glare in Backlit.</figcaption>
  </figure>
</main>
</body>
</html>
