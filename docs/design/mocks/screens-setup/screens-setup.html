<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Screens setup</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root { --bg-0:#eef1f4; --bg-1:#fff; --bg-2:#fff; --line:#dde3e8; --line-soft:#e8edf1; --ink:#1b242b; --ink-2:#5d6b75; --ink-3:#93a0a9; --focus:#e08a1e; --focus-ink:#fff; --ok:#2f8a57; --shadow-hover:rgba(0,0,0,.15);
  --font-ui:"IBM Plex Sans",system-ui,sans-serif; --font-data:"IBM Plex Mono",ui-monospace,monospace; --font-display:"IBM Plex Sans Condensed",system-ui,sans-serif; }
* { box-sizing:border-box; } body { margin:0; background:#d9dee3; font-family:var(--font-ui); color:var(--ink); }
.board { padding:32px 16px; max-width:1360px; margin:0 auto; } h1 { font-family:var(--font-display); margin:0 0 20px; }
figure { margin:0 0 32px; } figcaption { font-size:.85rem; color:var(--ink-2); margin-top:8px; max-width:1280px; }
.frame { width:1280px; height:720px; background:var(--bg-0); border-radius:6px; box-shadow:0 2px 12px rgba(0,0,0,.18); overflow:hidden; display:flex; flex-direction:column; }
.topbar { height:56px; flex:none; background:var(--bg-1); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 20px; gap:12px; font-weight:600; }
.topbar .sp { flex:1; } .done { height:36px; padding:0 14px; border-radius:8px; background:var(--focus); color:var(--focus-ink); display:flex; align-items:center; font-size:.85rem; }
.main { flex:1; display:grid; grid-template-columns:232px 1fr; min-height:0; }
.rail { border-right:1px solid var(--line); padding:14px 10px; display:flex; flex-direction:column; gap:4px; background:var(--bg-0); }
.cat { padding:9px 12px; border-radius:8px; border:1px solid transparent; }
.cat b { display:block; font-weight:500; font-size:.88rem; } .cat span { font-size:.72rem; color:var(--ink-3); }
.cat.on { background:var(--bg-1); border:2px solid var(--focus); }
.content { padding:20px 24px; overflow:hidden; }
.sec { background:var(--bg-1); border:1px solid var(--line); border-radius:12px; margin-bottom:14px; }
.sec h3 { margin:0; padding:12px 18px 4px; font-size:.98rem; font-weight:600; display:flex; align-items:center; gap:10px; }
.row { display:flex; align-items:center; gap:14px; padding:9px 18px; border-top:1px solid var(--line-soft); min-height:3.2rem; }
.sec h3 + .row { border-top:0; }
.txt { flex:1; min-width:0; } .txt b { font-weight:500; font-size:.92rem; } .txt p { margin:2px 0 0; font-size:.78rem; color:var(--ink-2); }
.src { color:var(--ink-3) !important; } .own { color:var(--ink) !important; font-weight:600; }
.link { font-size:.82rem; text-decoration:underline; text-underline-offset:3px; flex:none; }
.seg { flex:none; display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; font-size:.82rem; }
.seg span { padding:7px 12px; border-left:1px solid var(--line); } .seg span:first-child { border-left:0; }
.seg .on { background:color-mix(in srgb, var(--focus) 16%, var(--bg-2)); font-weight:500; }
.tog { width:42px; height:24px; border-radius:12px; background:var(--focus); position:relative; flex:none; }
.tog::after { content:""; position:absolute; right:3px; top:3px; width:18px; height:18px; border-radius:50%; background:#fff; }
.tog.off { background:var(--line); } .tog.off::after { right:auto; left:3px; }
.btn { flex:none; height:36px; padding:0 14px; border:1px solid var(--line); border-radius:9px; display:flex; align-items:center; font-size:.85rem; background:var(--bg-2); }
.btn.primary { background:var(--focus); border-color:var(--focus); color:var(--focus-ink); font-weight:600; }
.cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; padding:6px 18px 16px; }
.card { border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:start; background:var(--bg-2); }
.card.all { border-style:dashed; }
.card .nm { font-weight:600; } .card .id { font-family:var(--font-data); font-size:.7rem; color:var(--ink-3); }
.card .sum { grid-column:2; font-size:.75rem; color:var(--ink-2); } .card .sw { grid-column:1/-1; font-size:.72rem; color:var(--ink-3); border-top:1px solid var(--line-soft); padding-top:6px; margin-top:4px; }
.on-dot { color:var(--ok); font-size:.72rem; } .off-dot { color:var(--ink-3); font-size:.72rem; }
/* page thumbnails: region boxes */
.th { border:1.5px solid var(--ink-2); border-radius:5px; padding:3px; display:flex; gap:3px; background:var(--bg-0); grid-row:span 3; }
.th.l { width:96px; height:58px; } .th.p { width:40px; height:66px; flex-direction:column; }
.th i { flex:1; border-radius:2px; background:color-mix(in srgb, var(--focus) 22%, var(--bg-1)); }
.th i.b { background:color-mix(in srgb, var(--ink-3) 30%, var(--bg-1)); }
.th .bar { flex:0 0 6px; background:var(--ink-3); border-radius:2px; }
.th.l.withbar { flex-direction:column; } .th.l.withbar .inner { flex:1; display:flex; gap:3px; }
.back { font-size:.85rem; color:var(--ink-2); margin-bottom:10px; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.pg { display:flex; align-items:center; gap:12px; padding:8px 18px; border-top:1px solid var(--line-soft); }
.pg .th { grid-row:auto; } .pg .txt b { font-size:.9rem; }
.chk { width:20px; height:20px; border-radius:5px; border:1.5px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:.75rem; }
.chk.y { background:var(--focus); border-color:var(--focus); color:#fff; }
.radio { font-size:.78rem; color:var(--ink-2); display:flex; gap:6px; align-items:center; flex:none; } .radio u { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line); display:inline-block; }
.radio.y u { border:5px solid var(--focus); }
.live { flex:none; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 18px; font-size:.72rem; color:var(--ink-3); }
.live .th { grid-row:auto; width:90px; height:150px; }
.inp { flex:none; width:220px; height:38px; border:1px solid var(--line); border-radius:9px; padding:0 12px; display:flex; align-items:center; font-size:.9rem; }
/* editor */
.ed { flex:1; display:flex; flex-direction:column; background:var(--bg-1); margin:18px; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.ed-h { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; } .ed-h h2 { margin:0; font-size:1.15rem; flex:1; }
.ctx { display:flex; align-items:flex-start; gap:8px; padding:10px 20px; border-bottom:1px solid var(--line); }
.tab { padding:7px 14px; border:1px solid var(--line); border-radius:9px; font-size:.85rem; line-height:1.2; }
.tab small { display:block; font-size:.68rem; color:var(--ink-3); }
.tab.on { border:2px solid var(--focus); } .tab.dim { opacity:.5; }
.ctx .sp { flex:1; }
.pv { display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--ink-2); }
.pill { height:36px; padding:0 12px; border:1px solid var(--line); border-radius:9px; display:flex; align-items:center; gap:8px; color:var(--ink); font-size:.85rem; }
.pill::after { content:"▾"; color:var(--ink-3); font-size:.7rem; }
.badge { font-family:var(--font-data); font-size:.7rem; color:var(--ink-2); background:var(--bg-0); border:1px solid var(--line); border-radius:6px; padding:3px 8px; }
.stage { flex:1; display:grid; grid-template-columns:1fr 300px; min-height:0; }
.st { background:var(--bg-0); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:14px; padding-top:14px; }
.banner { align-self:stretch; margin:0 20px; display:flex; align-items:center; gap:12px; padding:10px 14px; background:color-mix(in srgb, var(--focus) 10%, var(--bg-1)); border:1px solid color-mix(in srgb, var(--focus) 45%, var(--line)); border-radius:10px; font-size:.85rem; }
.banner .t { flex:1; }
.dev { width:224px; height:398px; background:#1b242b; border-radius:14px; padding:9px; display:flex; flex-direction:column; gap:5px; opacity:.55; }
.dev .bar { flex:0 0 26px; background:#2a353e; border-radius:4px; color:#cfd7dc; font-size:.7rem; display:flex; align-items:center; padding:0 8px; font-family:var(--font-data); }
.dev .r { flex:1; border-radius:6px; background:#3a4650; color:#cfd7dc; font-size:.75rem; display:flex; align-items:center; justify-content:center; }
.note { font-size:.78rem; color:var(--ink-3); }
.insp { border-left:1px solid var(--line); padding:16px; font-size:.82rem; color:var(--ink-2); }
.insp h4 { margin:0 0 10px; color:var(--ink); font-size:.9rem; }
</style>
</head>
<body>
<main class="board">
  <h1>Setting up what each screen shows</h1>

  <figure>
    <div class="frame">
      <div class="topbar">Settings<span class="sp"></span><span class="done">Done</span></div>
      <div class="main">
        <div class="rail">
          <div class="cat"><b>Content</b><span>Calendars · photos · web pages</span></div>
          <div class="cat"><b>Dashboard</b><span>Pages · clock bar · theme</span></div>
          <div class="cat on"><b>Screens</b><span>Pages · rotation · power · touch</span></div>
          <div class="cat"><b>Plugins</b><span>Install · manage</span></div>
          <div class="cat"><b>System</b><span>Updates · backup</span></div>
          <div class="cat"><b>Security</b><span>Admin password · allowed sites</span></div>
        </div>
        <div class="content">
          <div class="sec">
            <h3>Screens <span class="sp" style="flex:1"></span><span class="btn">+ Add a screen</span></h3>
            <div class="cards">
              <div class="card all">
                <div class="th l"><i></i><i class="b"></i></div>
                <span class="nm">All screens</span>
                <span class="sum">Shared settings every screen uses unless it has its own</span>
                <span class="sum">Landscape · off 23:00–06:30 · keyboard Auto</span>
              </div>
              <div class="card">
                <div class="th l withbar"><span class="bar"></span><span class="inner"><i></i><i class="b"></i></span></div>
                <span class="nm">Kitchen <span class="on-dot">● Online</span></span>
                <span class="id">kitchen-pi</span>
                <span class="sum">3 pages · landscape</span>
                <span class="sw">Kiosk software 0.9.4 · up to date</span>
              </div>
              <div class="card">
                <div class="th p"><span class="bar"></span><i></i><i class="b"></i></div>
                <span class="nm">Hallway <span class="on-dot">● Online</span></span>
                <span class="id">hall-pi</span>
                <span class="sum">2 pages · portrait · upside down</span>
                <span class="sw">Kiosk software 0.9.2 · 0.9.4 available</span>
              </div>
            </div>
          </div>
          <div class="sec">
            <h3>All screens · Display</h3>
            <div class="row"><div class="txt"><b>Orientation</b><p>Which way the screen is mounted. Screens can override it.</p></div><div class="seg"><span class="on">Landscape</span><span>Portrait</span></div></div>
            <div class="row"><div class="txt"><b>Upside down</b><p>For screens mounted with the cable on top.</p></div><div class="tog off"></div></div>
            <div class="row"><div class="txt"><b>Rotate the screen output</b><p>On: Calvin turns the Pi's picture itself. Off: leave it to the OS or the screen.</p></div><div class="tog"></div></div>
          </div>
          <p class="note" style="margin:0 4px">Power (incl. reboot combo) · Touch &amp; keyboard follow. Remote &amp; buttons and key-press feedback move to Dashboard › Focus &amp; remote.</p>
        </div>
      </div>
    </div>
    <figcaption><b>S1 · The Screens category</b> (Kiosks + Screen &amp; keyboard merged). <b>All screens</b> holds the shared settings, and then each screen shows its name, a thumbnail of its start page in its own orientation, and a one-line summary.</figcaption>
  </figure>

  <figure>
    <div class="frame">
      <div class="topbar">Settings<span class="sp"></span><span class="done">Done</span></div>
      <div class="main">
        <div class="rail">
          <div class="cat"><b>Content</b><span>Calendars · photos · web pages</span></div>
          <div class="cat"><b>Dashboard</b><span>Pages · clock bar · theme</span></div>
          <div class="cat on"><b>Screens</b><span>Pages · rotation · power · touch</span></div>
          <div class="cat"><b>Plugins</b><span>Install · manage</span></div>
          <div class="cat"><b>System</b><span>Updates · backup</span></div>
          <div class="cat"><b>Security</b><span>Admin password · allowed sites</span></div>
        </div>
        <div class="content">
          <div class="back">‹ Screens</div>
          <div class="two">
            <div>
              <div class="sec">
                <h3>Hallway <span class="on-dot">● Online</span></h3>
                <div class="row"><div class="txt"><b>Name</b><p>Shown in this screen's clock bar.</p></div><div class="inp">Hallway</div></div>
              </div>
              <div class="sec">
                <h3>Pages <span style="flex:1"></span><span class="btn primary">Edit pages</span></h3>
                <div class="pg"><span class="chk y">✓</span><div class="th p"><span class="bar"></span><i></i><i class="b"></i></div><div class="txt"><b>Home</b></div><span class="radio y"><u></u>Start here</span></div>
                <div class="pg"><span class="chk y">✓</span><div class="th p"><span class="bar"></span><i class="b"></i></div><div class="txt"><b>Photos</b></div><span class="radio"><u></u>Start here</span></div>
                <div class="pg"><span class="chk"></span><div class="th p"><span class="bar"></span><i></i><i></i><i class="b"></i></div><div class="txt"><b>Week</b><p class="src">Not shown here</p></div><span class="radio" style="opacity:.4"><u></u>Start here</span></div>
              </div>
            </div>
            <div>
              <div class="sec">
                <h3>Display</h3>
                <div style="display:flex">
                  <div style="flex:1">
                    <div class="row"><div class="txt"><b>Orientation</b><p><span class="own">Only this screen</span> · <span class="link">Use the shared setting</span></p></div><div class="seg"><span>Landscape</span><span class="on">Portrait</span></div></div>
                    <div class="row"><div class="txt"><b>Upside down</b><p><span class="own">Only this screen</span> · <span class="link">Use the shared setting</span></p></div><div class="tog"></div></div>
                    <div class="row"><div class="txt"><b>Rotate the screen output</b><p class="src">Same as all screens</p></div><div class="tog"></div></div>
                  </div>
                  <div class="live"><div class="th p"><span class="bar"></span><i></i><i class="b"></i></div>Home · 1080×1920</div>
                </div>
              </div>
              <div class="sec">
                <h3>Power</h3>
                <div class="row"><div class="txt"><b>Screen on/off schedule</b><p class="src">Same as all screens</p></div><div class="tog"></div></div>
                <div class="row"><div class="txt"><b>Turn off when idle</b><p class="src">Same as all screens</p></div><div class="btn">15 min ▾</div></div>
              </div>
              <p class="note" style="margin:0 4px">Touch &amp; keyboard · Software follow.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <figcaption><b>S2 · One screen's page.</b> Its name (shown in its clock bar), the pages it shows with thumbnails and a start page, and Display with a live preview that follows Orientation and Upside down. Every row says whether it's shared or only this screen. <b>Edit pages</b> opens the editor already previewing Hallway.</figcaption>
  </figure>

  <figure>
    <div class="frame">
      <div class="ed">
        <div class="ed-h"><h2>Pages &amp; regions</h2><span style="font-size:1.3rem;color:var(--ink-3)">×</span></div>
        <div class="ctx">
          <div class="tab">Home<small>Kitchen · Hallway</small></div>
          <div class="tab on">Week<small>Kitchen</small></div>
          <div class="tab">Photos<small>Hallway</small></div>
          <div class="tab">+</div>
          <span class="sp"></span>
          <div class="pv">Preview on <span class="pill">Hallway</span><span class="badge">Portrait · 1080×1920 · mounted upside down</span></div>
        </div>
        <div class="stage">
          <div class="st">
            <div class="banner"><span class="t">Hallway doesn't show “Week”.</span><span class="btn primary">Show it on Hallway</span></div>
            <div class="dev"><div class="bar">Hallway · 09:07 Thu</div><div class="r">Calendar</div><div class="r">Calendar</div><div class="r">Photos</div></div>
            <span class="note">Previewing on Hallway · edits change the shared “Week” page</span>
          </div>
          <div class="insp"><h4>Page</h4>Name · Layout · Region direction · Clock bar (unchanged)</div>
        </div>
      </div>
    </div>
    <figcaption><b>S3 · The editor knows the screens.</b> Each page tab says where it's shown. <b>Preview on Hallway</b> uses Hallway's real shape (portrait, 1080×1920). Upside down is stated in the badge and doesn't turn the preview over. The warning has a working <b>Show it on Hallway</b> button instead of the dead "Kiosks" text.</figcaption>
  </figure>
</main>
</body>
</html>
