# Orca runs scripts.setup in every new worktree of this repo. Built from the lockfiles; edit freely.
# Heavy steps go through lane-heavy when the host has it.
# Keep the last line: agents wait for it before starting.
scripts:
  setup: |
    h=""; if [ -x "$HOME/.agents/bin/lane-heavy" ]; then h="$HOME/.agents/bin/lane-heavy"; fi
    if command -v uv >/dev/null 2>&1; then (cd backend && $h uv sync --frozen --quiet) || echo "setup: uv in backend failed" >&2; else echo "setup: uv not on PATH, skipped" >&2; fi
    if command -v npm >/dev/null 2>&1; then (cd frontend && $h npm ci --no-audit --no-fund --loglevel=error) || echo "setup: npm in frontend failed" >&2; else echo "setup: npm not on PATH, skipped" >&2; fi
    touch "$(git rev-parse --git-dir)/orca-setup-done"
